<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البيان للتسويق | لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
  <img src="logo.jpg" alt="شعار البيان للتسويق">
  <span class="brand" id="brand">البيان للتسويق</span>
  <span class="spacer"></span>
  <span class="user-box"><b id="uname"></b><small id="urole"></small></span>
  <button class="btn btn-light" id="logoutBtn">خروج</button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="content"><div class="loading">جارٍ التحميل...</div></main>
</div>

<script type="module">
import { db, logout, getCurrentUser } from './firebase-init.js';
import { doc, getDoc, getDocs, collection }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const roleNames = { admin: 'مدير النظام', manager: 'مشرف', cashier: 'بائع' };

// الصفحات: mod = ملف الصفحة، fn = دالة العرض، roles = من يراها
const pages = [
  { id: 'dashboard', title: 'لوحة التحكم',        roles: ['admin','manager','cashier'] },
  { id: 'sales',     title: 'المبيعات',           roles: ['admin','manager','cashier'], mod: 'sales',     fn: 'renderSales' },
  { id: 'products',  title: 'المنتجات والمخزن',   roles: ['admin','manager','cashier'], mod: 'products',  fn: 'renderProducts' },
  { id: 'purchases', title: 'المشتريات (الوارد)', roles: ['admin','manager'],           mod: 'purchases', fn: 'renderPurchases' },
  { id: 'adjust',    title: 'تسوية المخزن',       roles: ['admin','manager'],           mod: 'adjust',    fn: 'renderAdjust' },
  { id: 'reports',   title: 'التقارير والأرباح',  roles: ['admin','manager'],           mod: 'reports',   fn: 'renderReports' },
  { id: 'audit',     title: 'سجل العمليات',       roles: ['admin'],                     mod: 'audit',     fn: 'renderAudit' },
  { id: 'users',     title: 'المستخدمون',         roles: ['admin'],                     mod: 'users',     fn: 'renderUsers' }
];

const fmt = n => Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

let user, currency = 'ج.س';

async function init() {
  user = await getCurrentUser();
  if (!user) return location.replace('login.html');

  $('uname').textContent = user.fullName || user.email;
  $('urole').textContent = roleNames[user.role] || user.role;

  try {
    const s = await getDoc(doc(db, 'company_settings', 'main'));
    if (s.exists()) {
      $('brand').textContent = s.data().nameAr || 'البيان للتسويق';
      currency = s.data().currency || currency;
    }
  } catch (e) { /* قيم افتراضية */ }

  $('sidebar').innerHTML = pages.filter(p => p.roles.includes(user.role))
    .map(p => `<a data-page="${p.id}">${p.title}</a>`).join('');
  $('sidebar').addEventListener('click', e => {
    const a = e.target.closest('a[data-page]');
    if (a) { go(a.dataset.page); $('sidebar').classList.remove('open'); }
  });
  go('dashboard');
}

function go(id) {
  const page = pages.find(p => p.id === id);
  if (!page || !page.roles.includes(user.role)) return;
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.page === id));
  window.scrollTo(0, 0);
  if (id === 'dashboard') return renderDashboard();
  $('content').innerHTML = '<div class="loading">جارٍ التحميل...</div>';
  import(`./${page.mod}.js`)
    .then(m => m[page.fn]({ container: $('content'), user, currency }))
    .catch(e => { console.error(e); $('content').innerHTML = '<div class="placeholder">تعذّر تحميل الصفحة. حدّث الصفحة وحاول مرة أخرى.</div>'; });
}

async function renderDashboard() {
  const showMoney = ['admin', 'manager'].includes(user.role);
  $('content').innerHTML = '<h2>لوحة التحكم</h2><div class="loading">جارٍ تحميل بيانات اليوم...</div>';
  let sales = 0, cost = 0, profit = 0, invoices = 0, count = 0;
  const low = [];

  try {
    const ps = await getDocs(collection(db, 'products'));
    ps.forEach(d => {
      const p = d.data();
      if (p.isActive === false) return;
      count++;
      if ((p.currentQty || 0) <= (p.minQty || 0)) low.push(p);
    });
    low.sort((a, b) => (a.currentQty || 0) - (b.currentQty || 0));
  } catch (e) { console.error(e); }

  if (showMoney) {
    try {
      const d = await getDoc(doc(db, 'dailyStats', todayKey()));
      if (d.exists()) ({ totalSales: sales = 0, totalCost: cost = 0, netProfit: profit = 0, invoicesCount: invoices = 0 } = d.data());
    } catch (e) { console.error(e); }
  }

  const money = v => `${fmt(v)} <small>${esc(currency)}</small>`;
  const today = new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  $('content').innerHTML = `<h2>لوحة التحكم</h2>
    <p class="muted" style="margin:-.8rem 0 1rem">${today}</p>
    ${showMoney ? `
    <section class="eq" aria-label="أرباح اليوم">
      <div class="eq-cell"><span>مبيعات اليوم</span><b>${money(sales)}</b></div>
      <div class="eq-op" aria-hidden="true">−</div>
      <div class="eq-cell"><span>تكلفة البضاعة المباعة</span><b>${money(cost)}</b></div>
      <div class="eq-op" aria-hidden="true">=</div>
      <div class="eq-cell result"><span>صافي ربح اليوم</span><b>${money(profit)}</b></div>
    </section>` : ''}
    <div class="tiles">
      ${showMoney ? `<div class="tile"><span>فواتير اليوم</span><b>${fmt(invoices)}</b></div>` : ''}
      <div class="tile"><span>عدد المنتجات</span><b>${fmt(count)}</b></div>
      <div class="tile ${low.length ? 'alert' : ''}"><span>أصناف تحتاج توريداً</span><b>${fmt(low.length)}</b></div>
    </div>
    <div class="quick">
      <button class="btn" id="qSale">فاتورة بيع جديدة</button>
      ${showMoney ? '<button class="btn btn-light" id="qBuy">تسجيل شحنة واردة</button>' : ''}
    </div>
    ${low.length ? `<h3 class="sec-title">أصناف وصلت لحد التنبيه</h3>
      <div class="table-wrap"><table><thead><tr><th>المنتج</th><th>الرصيد</th><th>حد التنبيه</th></tr></thead><tbody>
      ${low.slice(0, 8).map(p => `<tr><td><b>${esc(p.name)}</b></td>
        <td><span class="badge low">${fmt(p.currentQty)}</span></td><td>${fmt(p.minQty)}</td></tr>`).join('')}
      </tbody></table></div>
      ${low.length > 8 ? `<p class="muted">وأصناف أخرى (${fmt(low.length - 8)}) في صفحة المنتجات.</p>` : ''}` : ''}`;

  $('qSale').onclick = () => go('sales');
  if ($('qBuy')) $('qBuy').onclick = () => go('purchases');
}

$('menuBtn').onclick = () => $('sidebar').classList.toggle('open');
$('logoutBtn').onclick = async () => { await logout(); location.replace('login.html'); };

init();
</script>
</body>
</html>
